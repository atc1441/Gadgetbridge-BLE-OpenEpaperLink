name: Release

# Every push to the default branch becomes a release: the APK is built, tagged and attached to
# it. Put [skip release] in a commit message to let one through without a release.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # the build stamps the short commit hash into the version name
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare the Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$manager" ]; then
            yes | "$manager" --licenses > /dev/null 2>&1 || true
            # the platform the project compiles against; the plugin would fetch it itself, but
            # only once the licences above have been accepted
            "$manager" "platforms;android-37" "build-tools;36.0.0" > /dev/null || true
          fi

      - name: Work out the version
        id: version
        run: |
          name=$(grep -m1 'versionName "' app/build.gradle | cut -d'"' -f2)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Optional, and worth setting up: without it the APK is signed with a throwaway debug key
      # that differs from run to run, and Android refuses to install such a build over the
      # previous one. See docs/releases.md.
      - name: Unpack the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key configured, falling back to a debug key. Android will refuse to install this build over an earlier release. See docs/releases.md."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            ./gradlew --no-daemon assembleMainlineNopebble \
              -Dnightly_store_file="$KEYSTORE" \
              -Dnightly_store_password="$STORE_PASSWORD" \
              -Dnightly_key_alias="$KEY_ALIAS" \
              -Dnightly_key_password="$KEY_PASSWORD"
          else
            ./gradlew --no-daemon assembleMainlineNopebble
          fi

      - name: Collect the APK
        run: |
          built=$(find app/build/outputs/apk/mainline/nopebble -name '*.apk' | head -1)
          test -n "$built"
          # a stable name, so that the link to the latest release never changes
          cp "$built" Gadgetbridge-OEPL.apk
          ls -lh Gadgetbridge-OEPL.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            echo "Built from \`${GITHUB_SHA}\`, Gadgetbridge ${APP_VERSION}."
            echo
            echo "Install \`Gadgetbridge-OEPL.apk\`. It carries the application id"
            echo "\`nodomain.freeyourgadget.gadgetbridge.nightly_nopebble\`, so it installs next to"
            echo "a normal Gadgetbridge rather than replacing it."
            if [ "$SIGNED" != "yes" ]; then
              echo
              echo "> This build is signed with a throwaway debug key and cannot be installed over"
              echo "> an earlier release. Uninstall the old one first, or give the repository a"
              echo "> signing key as described in \`docs/releases.md\`."
            fi
          } > notes.md

          gh release create "$TAG" Gadgetbridge-OEPL.apk \
            --title "Gadgetbridge OEPL $TAG" \
            --notes-file notes.md \
            --generate-notes
